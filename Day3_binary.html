<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Switch to Letter</title>
<style>
:root{
  --bg:#07090d;
  --panel:#111722;
  --panel2:#0d121b;
  --text:#f5f7fb;
  --muted:#788296;
  --line:#283143;
  --on:#ffffff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
}
body{user-select:none}
.deck{position:relative;width:100vw;height:100vh}
.slide{
  position:absolute; inset:0;
  display:grid; place-items:center;
  padding:6vh 7vw 10vh;
  opacity:0; transform:translateX(5%);
  pointer-events:none;
  transition:.35s ease;
}
.slide.active{opacity:1;transform:translateX(0);pointer-events:auto}
.slide.previous{transform:translateX(-5%)}
.content{
  width:min(1180px,100%);
  height:min(720px,78vh);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:3vh; text-align:center;
}
.kicker{
  color:var(--muted);
  font-size:clamp(12px,1.2vw,18px);
  letter-spacing:.22em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-size:clamp(54px,9vw,126px);
  line-height:.9;
  letter-spacing:-.06em;
}
h2{
  margin:0;
  font-size:clamp(34px,5vw,74px);
  letter-spacing:-.04em;
}
.small{
  color:var(--muted);
  font-size:clamp(14px,1.5vw,22px);
}
.switch-stage{
  display:flex; gap:8vw; align-items:center; justify-content:center; flex-wrap:wrap;
}
.switch-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.switch{
  width:180px;height:96px;border-radius:999px;
  border:2px solid var(--line);
  background:#101620;
  padding:8px;cursor:pointer;transition:.25s ease;
}
.knob{
  width:76px;height:76px;border-radius:50%;
  background:#394253;transition:.25s ease;
}
.switch.on{background:#fff;border-color:#fff}
.switch.on .knob{transform:translateX(84px);background:#07090d}
.state{
  font-weight:900;font-size:clamp(42px,6vw,82px);
  min-width:150px;
}
.arrow{
  color:var(--muted);
  font-size:clamp(42px,6vw,80px);
}
.mapping{
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:3vw;align-items:center;width:100%;
}
.mapping-box{
  min-height:210px;border:1px solid var(--line);border-radius:30px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  display:grid;place-items:center;
  font-size:clamp(68px,11vw,150px);font-weight:900;
}
.bits{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bit{
  width:clamp(62px,7vw,92px);
  height:clamp(100px,11vw,132px);
  border-radius:20px;border:1px solid var(--line);
  background:#101620;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:.2s ease;
}
.bit.on{
  background:#fff;color:#07090d;border-color:#fff;
  box-shadow:0 0 42px rgba(255,255,255,.25);
}
.bit-num{font-size:clamp(38px,5vw,68px);font-weight:900}
.bit-weight{font-size:12px;color:var(--muted)}
.bit.on .bit-weight{color:#3f4754}
.bit-summary{
  display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center;
}
.summary-box{
  border:1px solid var(--line);background:var(--panel);
  border-radius:22px;padding:18px 28px;min-width:170px;
}
.summary-box strong{display:block;font-size:clamp(32px,4vw,58px)}
.summary-box span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.ascii-grid{
  display:grid;grid-template-columns:repeat(8,1fr);
  gap:8px;width:100%;
}
.cell{
  min-height:62px;border:1px solid var(--line);
  border-radius:12px;background:#0f1520;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  font-size:18px;font-weight:800;transition:.2s ease;
}
.cell span{font-size:10px;color:var(--muted);font-weight:600}
.cell.highlight{background:#fff;color:#07090d;transform:scale(1.08)}
.cell.highlight span{color:#353d48}
.timeline{
  display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
}
.node{
  width:150px;height:150px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;
  font-size:clamp(32px,4vw,58px);font-weight:900;
}
.node small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em}
.journey{
  display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;flex-wrap:wrap;
}
.step{
  border:1px solid var(--line);background:var(--panel);
  border-radius:22px;padding:24px 20px;min-width:150px;
  opacity:.25;transform:scale(.96);transition:.3s ease;
}
.step.active{opacity:1;transform:scale(1);border-color:#fff}
.step strong{display:block;font-size:clamp(30px,4vw,54px)}
.step span{color:var(--muted);font-size:12px}
.j-arrow{color:var(--muted);font-size:30px}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{
  border:1px solid var(--line);background:#111724;color:#fff;
  border-radius:999px;padding:13px 22px;font-weight:800;cursor:pointer;
}
button:hover{border-color:#fff;background:#192231}
.why-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px;width:100%;
}
.why-card{
  min-height:180px;border:1px solid var(--line);border-radius:24px;
  background:var(--panel);display:grid;place-items:center;
  font-size:clamp(48px,6vw,86px);
}
.why-card span{
  display:block;color:var(--muted);font-size:12px;letter-spacing:.14em;margin-top:10px;
}
.progress{
  position:absolute;left:7vw;right:7vw;bottom:4vh;
  display:flex;align-items:center;gap:16px;z-index:20;
}
.bar{height:3px;background:#222a37;flex:1;border-radius:999px;overflow:hidden}
.bar div{height:100%;background:#fff;width:0;transition:.3s ease}
.count{color:var(--muted);font-size:13px;min-width:58px;text-align:right}
.hint{
  position:absolute;top:3.5vh;right:5vw;color:#596273;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
}
@media(max-width:820px){
  .ascii-grid{grid-template-columns:repeat(4,1fr)}
  .why-grid{grid-template-columns:repeat(2,1fr)}
  .mapping{grid-template-columns:1fr}
  .mapping .arrow{transform:rotate(90deg)}
  .journey{gap:8px}
  .j-arrow{display:none}
}
</style>
</head>
<body>
<div class="deck" id="deck">
  <div class="hint">← → SPACE CLICK</div>

  <!-- 1 -->
  <section class="slide active">
    <div class="content">
      <div class="kicker">Computer</div>
      <div class="switch-stage">
        <div class="switch-wrap">
          <div class="switch" id="mainSwitch"><div class="knob"></div></div>
          <div class="state" id="mainState">OFF</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 2 -->
  <section class="slide">
    <div class="content">
      <div class="kicker">Meaning</div>
      <div class="mapping">
        <div class="mapping-box" id="mapState">OFF</div>
        <div class="arrow">→</div>
        <div class="mapping-box" id="mapBit">0</div>
      </div>
      <button id="mapToggle">TOGGLE</button>
    </div>
  </section>

  <!-- 3 -->
  <section class="slide">
    <div class="content">
      <div class="kicker">8 bits = 1 byte</div>
      <div class="bits" id="bits"></div>
      <div class="bit-summary">
        <div class="summary-box"><strong id="binaryValue">00000000</strong><span>Binary</span></div>
        <div class="summary-box"><strong id="decimalValue">0</strong><span>Decimal</span></div>
      </div>
      <div class="controls">
        <button id="clearBits">CLEAR</button>
        <button id="randomBits">RANDOM</button>
      </div>
    </div>
  </section>

  <!-- 4 -->
  <section class="slide">
    <div class="content">
      <div class="kicker">ASCII</div>
      <h1 id="asciiHero">A = 65</h1>
      <div class="ascii-grid" id="asciiGrid"></div>
      <div class="controls">
        <button data-char="A">A</button>
        <button data-char="B">B</button>
        <button data-char="a">a</button>
        <button data-char="0">0</button>
      </div>
    </div>
  </section>

  <!-- 5 -->
  <section class="slide">
    <div class="content">
      <div class="kicker">Order</div>
      <div class="timeline">
        <div class="node">0–31<small>CONTROL</small></div>
        <div class="arrow">→</div>
        <div class="node">32<small>SPACE</small></div>
        <div class="arrow">→</div>
        <div class="node">48–57<small>0–9</small></div>
        <div class="arrow">→</div>
        <div class="node">65–90<small>A–Z</small></div>
        <div class="arrow">→</div>
        <div class="node">97–122<small>a–z</small></div>
      </div>
    </div>
  </section>

  <!-- 6 -->
  <section class="slide">
    <div class="content">
      <div class="kicker">Press A</div>
      <div class="journey">
        <div class="step active" data-step="0"><strong>⌨ A</strong><span>KEY</span></div>
        <div class="j-arrow">→</div>
        <div class="step" data-step="1"><strong>65</strong><span>ASCII</span></div>
        <div class="j-arrow">→</div>
        <div class="step" data-step="2"><strong>01000001</strong><span>BINARY</span></div>
        <div class="j-arrow">→</div>
        <div class="step" data-step="3"><strong>A</strong><span>SCREEN</span></div>
      </div>
      <div class="controls">
        <button id="journeyNext">NEXT</button>
        <button id="journeyAuto">AUTO</button>
        <button id="journeyReset">RESET</button>
      </div>
    </div>
  </section>

  <!-- 7 -->
  <section class="slide">
    <div class="content">
      <div class="kicker">Why it matters</div>
      <div class="why-grid">
        <div class="why-card">A<span>TEXT</span></div>
        <div class="why-card">7<span>NUMBER</span></div>
        <div class="why-card">♫<span>SOUND</span></div>
        <div class="why-card">▦<span>IMAGE</span></div>
      </div>
      <h2>ALL → 0 & 1</h2>
    </div>
  </section>

  <div class="progress">
    <div class="bar"><div id="progressFill"></div></div>
    <div class="count" id="slideCount">1 / 7</div>
  </div>
</div>

<script>
const slides=[...document.querySelectorAll('.slide')];
let current=0;
const progressFill=document.getElementById('progressFill');
const slideCount=document.getElementById('slideCount');

function showSlide(i){
  current=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,n)=>{
    s.classList.toggle('active',n===current);
    s.classList.toggle('previous',n<current);
  });
  progressFill.style.width=`${((current+1)/slides.length)*100}%`;
  slideCount.textContent=`${current+1} / ${slides.length}`;
}
function next(){showSlide(current+1)}
function prev(){showSlide(current-1)}

document.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}
  if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
});
document.getElementById('deck').addEventListener('click',e=>{
  if(e.target.closest('button,.switch,.bit')) return;
  if(e.clientX<innerWidth*.35) prev(); else next();
});

let mainOn=false;
const mainSwitch=document.getElementById('mainSwitch');
const mainState=document.getElementById('mainState');
mainSwitch.addEventListener('click',()=>{
  mainOn=!mainOn;
  mainSwitch.classList.toggle('on',mainOn);
  mainState.textContent=mainOn?'ON':'OFF';
});

let mapOn=false;
const mapState=document.getElementById('mapState');
const mapBit=document.getElementById('mapBit');
document.getElementById('mapToggle').addEventListener('click',()=>{
  mapOn=!mapOn;
  mapState.textContent=mapOn?'ON':'OFF';
  mapBit.textContent=mapOn?'1':'0';
});

const bitStates=Array(8).fill(0);
const bits=document.getElementById('bits');
const binaryValue=document.getElementById('binaryValue');
const decimalValue=document.getElementById('decimalValue');

function renderBits(){
  bits.innerHTML='';
  bitStates.forEach((state,index)=>{
    const weight=2**(7-index);
    const el=document.createElement('div');
    el.className=`bit ${state?'on':''}`;
    el.innerHTML=`<div class="bit-num">${state}</div><div class="bit-weight">${weight}</div>`;
    el.addEventListener('click',()=>{
      bitStates[index]=bitStates[index]?0:1;
      renderBits();
    });
    bits.appendChild(el);
  });
  const bin=bitStates.join('');
  binaryValue.textContent=bin;
  decimalValue.textContent=parseInt(bin,2);
}
document.getElementById('clearBits').addEventListener('click',()=>{bitStates.fill(0);renderBits()});
document.getElementById('randomBits').addEventListener('click',()=>{
  bitStates.forEach((_,i)=>bitStates[i]=Math.random()>.5?1:0);
  renderBits();
});
renderBits();

const asciiGrid=document.getElementById('asciiGrid');
const asciiHero=document.getElementById('asciiHero');

function buildAscii(){
  asciiGrid.innerHTML='';
  for(let code=32;code<=95;code++){
    const ch=String.fromCharCode(code);
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.code=code;
    cell.innerHTML=`${ch===' '?'␠':ch}<span>${code}</span>`;
    asciiGrid.appendChild(cell);
  }
}
function selectAscii(ch){
  const code=ch.charCodeAt(0);
  asciiHero.textContent=`${ch} = ${code}`;
  document.querySelectorAll('.cell').forEach(c=>{
    c.classList.toggle('highlight',Number(c.dataset.code)===code);
  });
}
buildAscii();
selectAscii('A');
document.querySelectorAll('[data-char]').forEach(btn=>{
  btn.addEventListener('click',()=>selectAscii(btn.dataset.char));
});

let journeyIndex=0;
let journeyTimer=null;
const journeySteps=[...document.querySelectorAll('.step')];
function renderJourney(){
  journeySteps.forEach((s,i)=>s.classList.toggle('active',i<=journeyIndex));
}
document.getElementById('journeyNext').addEventListener('click',()=>{
  journeyIndex=Math.min(3,journeyIndex+1);renderJourney();
});
document.getElementById('journeyReset').addEventListener('click',()=>{
  journeyIndex=0;renderJourney();
});
document.getElementById('journeyAuto').addEventListener('click',e=>{
  if(journeyTimer){
    clearInterval(journeyTimer);journeyTimer=null;e.target.textContent='AUTO';return;
  }
  journeyIndex=0;renderJourney();e.target.textContent='STOP';
  journeyTimer=setInterval(()=>{
    journeyIndex++;
    renderJourney();
    if(journeyIndex>=3){
      clearInterval(journeyTimer);journeyTimer=null;e.target.textContent='AUTO';
    }
  },700);
});

showSlide(0);
</script>
</body>
</html>
